x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  web:
    build: ./web
    profiles: [cpu, spark, rtx3090]
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator
    environment:
      VITE_API_BASE: /api

  orchestrator:
    build: ./orchestrator
    profiles: [cpu, spark, rtx3090]
    ports:
      - "8100:8100"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-default}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      ASR_URL: ${ASR_URL:-http://asr-cpu:8101}
      TTS_URL: ${TTS_URL:-http://tts-cpu:8102}
      # Empty on the CPU demo. Set http://pron:8103 when the pron service is up.
      PRON_URL: ${PRON_URL:-}
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:-http://localhost:8080}
      ASSETS_PATH: ${ASSETS_PATH:-/assets}
      SCENARIOS_PATH: /scenarios
      DB_PATH: /data/machi.sqlite
    volumes:
      - ./data:/data
      - ./scenarios:/scenarios:ro
      - ./assets:/assets:ro

  asr-cpu:
    build: ./speech-cpu
    profiles: [cpu]
    environment:
      SERVICE: asr
    ports:
      - "8101:8101"

  tts-cpu:
    build: ./speech-cpu
    profiles: [cpu]
    environment:
      SERVICE: tts
    ports:
      - "8102:8102"

  asr:
    <<: *gpu
    build:
      context: ./asr
      args:
        BASE: ${GPU_BASE:-nvcr.io/nvidia/pytorch:25.01-py3}
    profiles: [spark, rtx3090]
    environment:
      ASR_ENGINE: ${ASR_ENGINE:-qwen3-asr-0.6b}
    ports:
      - "8101:8101"
    volumes:
      - hf-cache:/root/.cache/huggingface

  tts:
    <<: *gpu
    build:
      context: ./tts
      args:
        BASE: ${GPU_BASE:-nvcr.io/nvidia/pytorch:25.01-py3}
    profiles: [spark, rtx3090]
    environment:
      VOICES: /voices/voices.yaml
    ports:
      - "8102:8102"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./voices:/voices:ro

  pron:
    build: ./pron
    profiles: [spark, rtx3090]
    ports:
      - "8103:8103"

  assets:
    image: nginx:1.27-alpine
    profiles: [cpu, spark, rtx3090]
    ports:
      - "8080:8080"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./assets/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  hf-cache: {}