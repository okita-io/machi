# Speech placement: docs/ADR-001-speech-placement.md
# Default when both GPUs are up: ASR/TTS on the RTX 3090 (profile rtx3090)
# so Spark keeps headroom for the LLM and April's ComfyUI (:8188).
# Start profile spark for speech only when the 3090 is absent.
# Profile cpu is the stub demo. Knobs: GPU_MEM_FRACTION, ASR_ENGINE, GPU_BASE, SPEECH_PROFILE.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  web:
    image: machi-web:local
    build: ./web
    profiles: [cpu, spark, rtx3090]
    ports:
      - "5173:5173"
    depends_on:
      - orchestrator
    environment:
      VITE_API_BASE: /api

  # Opt-in LAN HTTPS for the phone mic. Plain HTTP stays on `web` :5173.
  # This service sets HTTPS=1 and listens on :5174. It is not in the cpu/spark/rtx3090
  # profiles, so `docker compose --profile cpu up` does not publish it.
  #   ./scripts/make_lan_https.sh
  #   docker compose --profile cpu --profile https up
  # Local vite (no Docker): HTTPS=1 npm run dev   # https://<lan-ip>:5174
  web-https:
    image: machi-web:local
    build: ./web
    profiles: [https]
    ports:
      - "5174:5174"
    depends_on:
      - orchestrator
    environment:
      HTTPS: "1"
    volumes:
      - ./.certs:/etc/nginx/certs:ro

  orchestrator:
    build: ./orchestrator
    profiles: [cpu, spark, rtx3090]
    ports:
      - "8100:8100"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-default}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      ASR_URL: ${ASR_URL:-http://asr-cpu:8101}
      TTS_URL: ${TTS_URL:-http://tts-cpu:8102}
      # Empty on the CPU demo. Set http://pron:8103 when the pron service is up.
      PRON_URL: ${PRON_URL:-}
      ASSETS_BASE_URL: ${ASSETS_BASE_URL:-http://localhost:8080}
      ASSETS_PATH: ${ASSETS_PATH:-/assets}
      SCENARIOS_PATH: /scenarios
      DB_PATH: /data/machi.sqlite
      # voices/voices.yaml. Empty SPEECH_PROFILE uses each voice's first engine.
      VOICES_PATH: /voices/voices.yaml
      SPEECH_PROFILE: ${SPEECH_PROFILE:-}
    volumes:
      - ./data:/data
      - ./scenarios:/scenarios:ro
      - ./assets:/assets:ro
      - ./voices:/voices:ro

  asr-cpu:
    build: ./speech-cpu
    profiles: [cpu]
    environment:
      SERVICE: asr
    ports:
      - "8101:8101"

  tts-cpu:
    build: ./speech-cpu
    profiles: [cpu]
    environment:
      SERVICE: tts
    ports:
      - "8102:8102"

  asr:
    <<: *gpu
    build:
      context: ./asr
      args:
        BASE: ${GPU_BASE:-nvcr.io/nvidia/pytorch:25.01-py3}
    profiles: [spark, rtx3090]
    environment:
      # kotoba-whisper-faster is x86 / rtx3090 only. See docs/ADR-001-speech-placement.md.
      ASR_ENGINE: ${ASR_ENGINE:-qwen3-asr-0.6b}
      # Cap this process. On Spark keep it ≤ 0.35 and do not leave the container up
      # beside the LLM and ComfyUI. Stop `asr` to unload.
      GPU_MEM_FRACTION: ${GPU_MEM_FRACTION:-0.40}
    ports:
      - "8101:8101"
    volumes:
      - hf-cache:/root/.cache/huggingface

  tts:
    <<: *gpu
    build:
      context: ./tts
      args:
        BASE: ${GPU_BASE:-nvcr.io/nvidia/pytorch:25.01-py3}
    profiles: [spark, rtx3090]
    environment:
      # Same map the orchestrator resolves. See docs/ADR-001-speech-placement.md.
      VOICES: /voices/voices.yaml
      GPU_MEM_FRACTION: ${GPU_MEM_FRACTION:-0.40}
    ports:
      - "8102:8102"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./voices:/voices:ro

  pron:
    build: ./pron
    profiles: [spark, rtx3090]
    ports:
      - "8103:8103"

  assets:
    image: nginx:1.27-alpine
    profiles: [cpu, spark, rtx3090]
    ports:
      - "8080:8080"
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./assets/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  hf-cache: {}