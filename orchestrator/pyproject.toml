[project]
name = "machi-orchestrator"
version = "0.1.0"
description = "Machi conversation tutor orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "openai>=1.55.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  # MIT / BSD. unidic-lite ships its dictionary in the wheel (no system MeCab dict).
  "cutlet>=0.4.0",
  "fugashi>=1.3.0",
  "unidic-lite>=1.0.8",
]

[project.optional-dependencies]
# Same packages as the main deps, so `pip install -e ".[nlp]"` keeps working.
nlp = ["cutlet>=0.4.0", "fugashi>=1.3.0", "unidic-lite>=1.0.8"]
# Silero VAD ONNX. Not required for typed turns or push-to-talk.
vad = ["numpy>=1.26", "onnxruntime>=1.20"]
# Smart Turn v3 (BSD-2-Clause). Off unless SMART_TURN_ENABLED=1. Not in the CPU image.
smart-turn = [
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "torch>=2.2",
  "transformers>=4.46",
  "huggingface-hub>=0.26",
]

dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e_latency: spoken-turn latency against orchestrator and speech services",
  "accent: beginner-phrase ASR fixtures; skipped unless ASR_URL answers /health",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["machi"]