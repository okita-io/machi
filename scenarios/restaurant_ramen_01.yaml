id: restaurant_ramen_01
title:
  en: "Ramen shop: a table for two"
  ja: "ラーメン屋"
level: [1, 2, 3, 4]
scene:
  background: bg/ramen.webp
  sprite: sprites/sora/neutral.webp
  ambience: sfx/ramen_shop_loop.ogg
  hotspots:
    - rect: [812, 140, 210, 60]
      ja: "営業中"
      kana: "えいぎょうちゅう"
      en: "Open for business"
    - rect: [120, 380, 300, 220]
      ja: "お品書き"
      kana: "おしながき"
      en: "Menu"
      opens: menu_ramen
npc:
  id: staff_tanaka
  role: "Ramen shop staff, early 20s, cheerful, busy lunch rush"
  voice:
    engine: qwen3_tts
    speaker: Ono_Anna
    style: "bright, quick, polite"
  register: polite_service
  speed:
    1: slow
    2: natural
    3: natural
    4: fast
guide:
  id: sora
  sprite: sprites/sora/neutral.webp
  voice:
    engine: irodori
    design: "gentle young woman, warm, slightly playful"
goals:
  - id: party_size
    prompt_en: "Tell them how many people are in your party (2)."
    accept:
      - "ふたりです"
      - "二人です"
      - "ふたり"
      - "2人お願いします"
    slots:
      count: 2
  - id: order
    prompt_en: "Order one shoyu ramen."
    accept_intent: order_item
    slots:
      item: shoyu_ramen
      qty: 1
    accept:
      - "醤油ラーメン"
      - "しょうゆラーメン"
      - "醤油ラーメンを一つ"
      - "しょうゆラーメンをひとつ"
      - "醤油ラーメンを一つお願いします"
  - id: ask_water
    prompt_en: "Ask for water."
    optional: true
    accept:
      - "お水"
      - "おみず"
      - "水ください"
      - "お水をください"
  - id: pay
    prompt_en: "Ask for the bill and pay by card."
    slots:
      method: card
    accept:
      - "お会計"
      - "会計"
      - "お会計お願いします"
      - "カード"
      - "カードで"
      - "カードで大丈夫ですか"
  - id: noodle_firmness
    prompt_en: "Choose a noodle firmness: firm, regular, or soft."
    optional: true
    coach_en: "Say かため (firm), ふつう (regular), or やわらかめ (soft)."
    accept:
      - "かため"
      - "硬め"
      - "固め"
      - "katame"
      - "かためで"
      - "ふつう"
      - "普通"
      - "futsuu"
      - "futsu"
      - "ふつうで"
      - "やわらかめ"
      - "柔らかめ"
      - "軟らかめ"
      - "yawarakame"
      - "やわらかめで"
key_phrases:
  - ja: "二人です"
    kana: "ふたりです"
    romaji: "futari desu"
    en: "Two people."
  - ja: "醤油ラーメンを一つお願いします"
    kana: "しょうゆラーメンをひとつおねがいします"
    romaji: "shouyu raamen o hitotsu onegaishimasu"
    en: "One shoyu ramen, please."
  - ja: "お水をください"
    kana: "おみずをください"
    romaji: "omizu o kudasai"
    en: "Water, please."
  - ja: "お会計お願いします"
    kana: "おかいけいおねがいします"
    romaji: "okaikei onegaishimasu"
    en: "Check, please."
  - ja: "カードで大丈夫ですか"
    kana: "カードでだいじょうぶですか"
    romaji: "kaado de daijoubu desu ka"
    en: "Is card OK?"
flow:
  start: greet
  nodes:
    greet:
      npc: "いらっしゃいませ！何名様ですか？"
      npc_kana: "いらっしゃいませ！なんめいさまですか？"
      expects: party_size
      on_success: seat
      on_other:
        clarify: "何名様でしょうか？"
        max_retries: 2
    seat:
      npc: "こちらのお席へどうぞ。ご注文がお決まりでしたらお呼びください。"
      npc_kana: "こちらのおせきへどうぞ。ごちゅうもんがおきまりでしたらおよびください。"
      expects: [order, ask_water]
      on_success:
        order: order_curveball
        ask_water: confirm_order
    order_curveball:
      kind: branch
      condition:
        level_gte: 3
      high: noodle_firmness
      low: confirm_order
    noodle_firmness:
      npc: "麺の硬さは硬め・普通・やわらかめのどれになさいますか？"
      npc_kana: "めんのかたさはかため・ふつう・やわらかめのどれになさいますか？"
      expects: noodle_firmness
      on_success: confirm_order
      on_other:
        clarify: "硬め、普通、やわらかめのどれになさいますか？"
        max_retries: 2
    confirm_order:
      npc: "醤油ラーメンお一つですね。少々お待ちください。"
      npc_kana: "しょうゆラーメンおひとつですね。しょうしょうおまちください。"
      next: pay
    pay:
      expects: pay
      npc_on_success: "ありがとうございました！"
      npc_on_success_kana: "ありがとうございました！"
      on_success: debrief
    debrief:
      debrief: true
      end: true
      narration_en: "You paid and the visit is done."
success:
  required: [party_size, order, pay]
  stars:
    3: "no hints above level default"
    2: "one rung climbed"
    1: "completed"
srs_tags: [restaurant, counters, polite_requests, ordering]