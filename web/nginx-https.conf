server {
    listen 5174 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/machi.crt;
    ssl_certificate_key /etc/nginx/certs/machi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ws/ {
        proxy_pass http://orchestrator:8100/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://orchestrator:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
