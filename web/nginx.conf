server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ws/ {
        proxy_pass http://orchestrator:8100/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://orchestrator:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Vite puts hashed JS/CSS under /assets/; scene art uses the same prefix from the orchestrator.
    # Serve bundle files from this image first, then proxy misses to the assets container.
    location /assets/ {
        try_files $uri @scene_assets;
    }

    location @scene_assets {
        rewrite ^/assets/?(.*)$ /$1 break;
        proxy_pass http://assets:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}